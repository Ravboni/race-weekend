name: Build and publish webOS package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Build IPK
        run: ./scripts/package.sh

      - name: Create checksum
        run: cd dist && sha256sum *.ipk > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: F1 TV for webOS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/SHA256SUMS
