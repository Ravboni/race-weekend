name: Build and publish webOS package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    if: github.actor == 'Ravboni'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish: release tags must point to a commit on main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6

      - name: Build IPK
        run: ./scripts/package.sh

      - name: Create checksum
        run: cd dist && sha256sum *.ipk > SHA256SUMS

      - name: Attest IPK build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.ipk'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Race Weekend Viewer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/SHA256SUMS
