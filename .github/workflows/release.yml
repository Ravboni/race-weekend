name: Build and publish webOS package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    if: github.actor == 'Ravboni'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish: release tags must point to a commit on main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Build IPK
        run: ./scripts/package.sh

      - name: Create checksum
        run: cd dist && sha256sum *.ipk > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Race Weekend Viewer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/SHA256SUMS
