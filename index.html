<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090a0e">
    <title>F1 TV</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="vendor/dash.all.min.js"></script>
    <script defer src="vendor/qrcode.js"></script>
    <script defer src="auth.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="F1 TV home">
          <span class="brand-mark" aria-hidden="true">F1</span>
          <span class="brand-name">TV</span>
        </div>
        <nav id="primary-nav" class="primary-nav" aria-label="F1 TV sections"></nav>
        <button id="account-button" class="profile-chip focusable" type="button"><span class="profile-avatar">J</span><span id="account-label">F1 TV</span></button>
      </header>

      <main id="main-content" class="main-content">
        <section id="home-view" class="home-view" aria-label="F1 TV home">
          <div id="hero" class="hero"></div>
          <h1 id="page-label" class="page-label" hidden></h1>
          <div id="content-rails" class="content-rails" aria-live="polite">
            <div class="loading-state"><span class="loading-spinner"></span><span>Loading your F1 TV home…</span></div>
          </div>
        </section>

        <section id="player-view" class="player-view" aria-label="F1 TV player" hidden>
          <video id="player-video" class="player-video" playsinline></video>
          <div class="player-chrome">
            <button id="player-back" class="back-button focusable" type="button"><span aria-hidden="true">‹</span> Back</button>
            <div class="player-status"><span class="player-live-dot"></span><span id="player-status-text">Connecting to F1 TV…</span></div>
            <h1 id="player-title"></h1>
            <div class="player-controls">
              <button id="player-toggle" class="button button-glass focusable" type="button">Pause</button>
              <button id="player-mute" class="button button-glass focusable" type="button">Mute</button>
              <button id="player-live" class="button button-glass focusable" type="button" hidden>Go to Live</button>
            </div>
            <div class="player-timeline">
              <input id="player-scrubber" class="focusable" type="range" min="0" max="1000" value="1000" aria-label="Seek through programme">
              <span id="player-time">LIVE</span>
            </div>
          </div>
          <div id="player-error" class="player-error" hidden></div>
        </section>

        <section id="detail-view" class="detail-view" aria-label="Content details" hidden>
          <div id="detail-backdrop" class="detail-backdrop"></div>
          <div class="detail-content">
            <button id="back-button" class="back-button focusable" type="button"><span aria-hidden="true">‹</span> Back</button>
            <p id="detail-eyebrow" class="detail-eyebrow"></p>
            <h1 id="detail-title"></h1>
            <p id="detail-meta" class="detail-meta"></p>
            <p id="detail-description" class="detail-description"></p>
            <div class="detail-actions">
              <button id="play-button" class="button button-primary focusable" type="button"><span class="play-icon">▶</span><span>Play</span></button>
              <button id="list-button" class="button button-secondary focusable" type="button"><span class="list-icon">＋</span><span>Add to My List</span></button>
            </div>
            <p id="detail-note" class="detail-note"></p>
          </div>
        </section>

        <section id="error-view" class="error-view" hidden>
          <p class="detail-eyebrow">F1 TV</p>
          <h1>Can’t load the home feed.</h1>
          <p class="detail-description">Check your TV’s internet connection and try again.</p>
          <button id="retry-button" class="button button-primary focusable" type="button">Try again</button>
        </section>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <section id="sign-in-dialog" class="sign-in-dialog" aria-label="Sign in to F1 TV" hidden>
        <div class="sign-in-card">
          <p class="detail-eyebrow">F1 TV ACCOUNT</p>
          <h2>Link your account</h2>
          <p id="sign-in-instructions">Use your phone to approve this TV with F1.</p>
          <canvas id="pairing-qr" width="240" height="240" hidden></canvas>
          <p id="pairing-code" class="pairing-code" hidden></p>
          <p id="pairing-status" class="pairing-status">Starting secure sign-in…</p>
          <button id="sign-in-cancel" class="button button-secondary focusable" type="button">Cancel</button>
        </div>
      </section>
    </div>
  </body>
</html>
